  /logs/trace/{globalRequestId}:
    get:
      description: "One browser request fans out across microservices, so the identifier\
        \ appears on several rows, and that fan-out is what this route shows. It returns\
        \ one span per component that handled the request and one per Cypher statement\
        \ underneath it, on a shared timeline, with the summed handler time, the summed\
        \ database time and the share the second is of the first. A handler that is\
        \ slow with a low share is slow for reasons other than the database. Spans\
        \ overlap, so the summed times are not wall time; `spanMs` is. Requires the\
        \ monitor read permission."
      operationId: trace
      parameters:
      - description: The global request identifier to resolve. An identifier no log
          row carries answers 200 with no spans.
        in: path
        name: globalRequestId
        required: true
        schema:
          type: string
      - description: How many spans to return per log table. Defaults to 500 and is
          capped at 2000. Passing the cap is how a pathological request stays cheap
          to look at.
        in: query
        name: maxSpans
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResult"
          description: The spans of the request and their cross-table totals
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The identifier was blank
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: Resolve one global request identifier into a distributed trace
      tags:
      - Log query
  /logs/usage/cypher:
    get:
      description: "One row per distinct Neo4j statement executed in the range, identified\
        \ by its operation name and the hash of its text, most executed first. Each\
        \ row carries how often the statement ran and how long it took, plus a sample\
        \ of its text from the query catalogue, truncated to two thousand characters.\
        \ This route reports statements CEDAR already ran. It does not accept or run\
        \ a query of its own. Requires the monitor read permission."
      operationId: cypher_1
      parameters:
      - description: "Inclusive lower bound, as an ISO-8601 instant in UTC. Defaults\
          \ to seven days before the upper bound."
        in: query
        name: from
        schema:
          type: string
      - description: "Exclusive upper bound, as an ISO-8601 instant in UTC. Defaults\
          \ to now."
        in: query
        name: to
        schema:
          type: string
      - description: How many rows to return. Defaults to 50 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CypherStat"
          description: "One row per distinct statement, most executed first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The log database could not be read, or a bound was not an\
            \ ISO-8601 instant"
      security:
      - api_key: []
      summary: Break a time range down by Cypher statement
      tags:
      - Log usage
