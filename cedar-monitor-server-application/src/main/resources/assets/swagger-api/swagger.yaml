  /mysql/counts:
    get:
      description: "Report every table in every MySQL schema CEDAR's configured datasources\
        \ can see — the application log database and the messaging database — with\
        \ each table's row count, engine, and the space its data, indexes and freed\
        \ pages occupy. Row counts are the optimizer's estimate unless exact=true\
        \ is asked for, which counts the rows instead and can take a while over the\
        \ log tables."
      operationId: mySqlCounts
      parameters:
      - description: Count rows with COUNT(*) instead of reading the optimizer's estimate
        in: query
        name: exact
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: A per-table report for each reachable database
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Count and measure what MySQL holds
      tags:
      - Counts
  /redis/queue-counts:
    get:
      description: "Report how many items are waiting in each of CEDAR's Redis queues:\
        \ search permissions, NCBI submissions, application logs, value recommender,\
        \ and instance cloning. A queue that keeps growing is the sign that whatever\
        \ drains it has stopped."
      operationId: queueCounts
      responses:
        "200":
          description: A count per queue
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get the depth of each work queue
      tags:
      - Queues
  /resource/folders:
    get:
      description: "Gather what each store holds about one folder into a single answer:\
        \ the workspace graph's record of it and its path, its computed permissions,\
        \ and the OpenSearch document. Written for diagnosis rather than for an application:\
        \ the point is to see the stores side by side, since a folder that behaves\
        \ oddly usually has one store disagreeing with another. A store that cannot\
        \ be reached leaves its section null rather than failing the request, and\
        \ an identifier nothing knows returns an empty answer with 200."
      operationId: getFolderInfo
      parameters:
      - description: Identifier of the folder to report on.
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: What each store holds about the folder
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get everything CEDAR knows about a folder
      tags:
      - Diagnostics
  /resource/groups:
