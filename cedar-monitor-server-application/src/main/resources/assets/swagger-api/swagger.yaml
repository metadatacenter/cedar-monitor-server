  /resources/counts:
    get:
      description: "Report how many users, groups, categories, folders, and artifacts\
        \ of each type Neo4j holds. This is the authoritative count; the search index\
        \ is compared against it."
      operationId: resourceCounts
      responses:
        "200":
          description: "A count per kind, as the workspace graph has them"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
