openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The monitor server reports on the rest of CEDAR: how deep the work queues are, how much each
    store holds, whether a given server considers itself healthy, and what artifact a given string
    refers to.

    Everything here is read-only and needs the monitor read permission. The counts are meant to be
    read against each other: the workspace graph is authoritative, and the search index disagreeing
    with it is how a half-finished reindex shows itself.
  title: CEDAR Monitor Server API
  version: 2.9.8-SNAPSHOT
paths:
  /command/resource-id-lookup:
    get:
      description: "Take anything that might name a CEDAR artifact — an identifier,\
        \ an IRI, a URL from the workbench, a path with a query string — and report\
        \ the artifact identifier it resolves to, and how that was arrived at. Written\
        \ for reading a support ticket or a log line, where what arrives is whatever\
        \ a user pasted. Always answers 200: a string that resolves to nothing is\
        \ a finding, not a failed request, and the body says so."
      operationId: lookUpResource
      parameters:
      - description: The string to resolve. Leading and trailing space is trimmed;
          the sanitized form is echoed in the response.
        in: query
        name: input
        schema:
          type: string
      responses:
        "200":
          description: "What the input resolved to, and how"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Work out which artifact a string refers to
      tags:
      - Diagnostics
  /environment-model/declarations:
    get:
      description: "The static declaration table for the frontends, the admin and\
        \ caDSR tools, the Keycloak event listener and the shell utilities. Names\
        \ only — these components are builds and scripts, not processes that can be\
        \ asked what they resolved."
      operationId: declarations
      responses:
        "200":
          description: Declared variable names per component
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get the declared variables of every non-server component
      tags:
      - Environment model
  /environment-model/unmodelled:
    get:
      description: "Names only, never values: a variable outside CedarEnvironmentVariable\
        \ carries no secrecy flag, so its value is withheld. A name here is either\
        \ a consumer reading the environment directly, or a variable that has fallen\
        \ out of use."
      operationId: unmodelled
      responses:
        "200":
          description: Names of unmodelled CEDAR_* variables
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get CEDAR_* variables set on this host that the configuration model
        does not define
      tags:
      - Environment model
  /health-check/{server}:
    get:
      description: "Proxy the named server's health check. The status and body are\
        \ the other server's own, so a 500 here can mean that server is unhealthy\
        \ rather than that this one failed."
      operationId: healthCheck
      parameters:
      - description: "CEDAR server name, as the configuration spells it. Examples:\
          \ artifact, terminology, resource."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The named server's health check, as it reported it"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          description: "The named server reported itself unhealthy with its own body,\
            \ or its response could not be read"
      security:
      - api_key: []
      summary: Get another server's health check
      tags:
      - Health checks
  /host/disk:
    get:
      description: "Room left on the filesystems CEDAR writes to, plus the largest\
        \ files under CEDAR_HOME/log with their sizes and ages. A large file that\
        \ is still being written to is a log nothing is rotating."
      operationId: disk
      responses:
        "200":
          description: Filesystem usage and log file sizes
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get disk usage and the largest log files on this host
      tags:
      - Host
  /host/git:
    get:
      description: "Branch, commit, commit date, upstream distance and uncommitted\
        \ tracked-file count for each repository under CEDAR_HOME. A non-zero uncommitted\
        \ count is a hot-patch applied directly on the box, which the next pull would\
        \ overwrite."
      operationId: git
      responses:
        "200":
          description: One entry per repository
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get the git state of every CEDAR repository on this host
      tags:
      - Host
