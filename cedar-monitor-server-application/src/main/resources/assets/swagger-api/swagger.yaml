          description: default response
  /logs/facets/{column}:
    get:
      operationId: facet
      parameters:
      - in: path
        name: column
        required: true
        schema:
          type: string
      - in: query
        name: table
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      responses:
        default:
          content:
            application/json: {}
          description: default response
  /logs/query:
    post:
      operationId: query
      requestBody:
        content:
          application/json:
            schema:
