      description: "The version the named server's environment declares, together\
        \ with the path and modification time of the artifact its JVM actually loaded,\
        \ its uptime and its host."
      operationId: build
      parameters:
      - description: "CEDAR server name, as the configuration spells it."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerBuildReport"
          description: The named server's build report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The named server could not be read
      security:
      - api_key: []
      summary: Get a server's version and build report
      tags:
      - Server report
  /server-report/{server}/configuration:
    get:
      description: "cedar-main.yml as the named server resolved it, with secrets masked.\
        \ Placeholders that could not be resolved are left as the literal ${NAME}."
      operationId: configuration
      parameters:
      - description: "CEDAR server name, as the configuration spells it."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfigurationReport"
          description: The named server's resolved configuration
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The named server could not be read
      security:
      - api_key: []
      summary: Get a server's resolved configuration
      tags:
      - Server report
  /server-report/{server}/environment:
    get:
      description: "The environment variables the named server resolved its configuration\
        \ from, with secret values masked and undeclared values withheld. Read one\
        \ server per call; the monitoring UI reads all of them in parallel to build\
        \ the drift matrix."
      operationId: environment
      parameters:
      - description: "CEDAR server name, as the configuration spells it. Examples:\
          \ artifact, terminology, resource."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerEnvironmentReport"
          description: The named server's environment report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The named server could not be read
      security:
      - api_key: []
      summary: Get a server's environment variable report
      tags:
      - Server report
  /server-report/{server}/insight:
    get:
      description: "Heap and non-heap memory, thread counts, garbage collection counts\
        \ and host load for the named server. Thread stack traces are deliberately\
        \ not included: the full dump runs to roughly half a megabyte per server and\
        \ is served by the server's own /insight/thread-details."
      operationId: insight
      parameters:
      - description: "CEDAR server name, as the configuration spells it."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerJvmReport"
          description: The named server's JVM report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The named server could not be read
      security:
      - api_key: []
      summary: Get a server's JVM report
      tags:
      - Server report
  /worker/lag:
    get:
      description: "The depth of the application log queue in Redis together with\
        \ the age of the newest row in each log table, and the verdict those two imply:\
        \ OK, LAGGING or STALLED. Reported together because neither number means anything\
        \ alone."
      operationId: lag
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerLagReport"
          description: "Queue depth, write lag and verdict"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Redis or the log database could not be read
      security:
      - api_key: []
      summary: Get the log pipeline's queue depth and write lag
      tags:
      - Worker
components:
  schemas:
    ArtifactCountsByType:
      type: object
      additionalProperties: false
      description: One count per artifact type.
      properties:
        element:
          type: integer
          format: int64
        field:
          type: integer
          format: int64
        folder:
          type: integer
          format: int64
        instance:
          type: integer
          format: int64
        template:
          type: integer
          format: int64
    ArtifactDiagnosticReport:
      type: object
      additionalProperties: false
      description: |
        What each store holds about one artifact. Empty where the workspace graph does not know the
        identifier, since the graph's record is what the other sections are gathered from.
      properties:
        computed:
          type: object
          additionalProperties: false
          description: What the workspace derives from the graph rather than stores
            in it.
          properties:
            materializedPermissions:
              $ref: "#/components/schemas/MaterializedPermissions"
            permissions:
              $ref: "#/components/schemas/ResourcePermissions"
            report:
              type: object
              additionalProperties: true
              description: |
                The artifact report the workbench reads: the graph record together with the current
                user's capabilities, the version chain, the categories attached to it and its DOI.
        neo4j:
          type: object
          additionalProperties: false
          properties:
            artifact:
              allOf:
              - $ref: "#/components/schemas/WorkspaceResourceRecord"
              description: "The graph's record of the artifact, with its path and\
                \ parent folder resolved."
        opensearch:
          type: object
          additionalProperties: false
          properties:
            document:
              $ref: "#/components/schemas/SearchIndexDocument"
        resourceType:
          type: string
          description: The kind the graph recorded for the identifier.
          enum:
          - field
          - element
          - template
          - instance
    Board:
      type: object
      properties:
        defaultRangeMinutes:
          type: integer
          format: int32
        endpoint:
          type: string
        group:
          type: string
        id:
          type: string
        note:
          type: string
        question:
          type: string
        spec:
          $ref: "#/components/schemas/LogQuerySpec"
        title:
          type: string
    CedarError:
      type: object
      additionalProperties: false
      description: A CEDAR error response. Diagnostic fields are populated only when
        they are relevant to the failure.
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
            description: Named domain entities associated with exception-mapped errors.
            nullable: true
          description: Named domain entities associated with exception-mapped errors.
          nullable: true
        errorId:
          type: string
          format: uuid
          description: Correlation identifier for an internal error recorded in server
            logs.
          nullable: true
        errorKey:
          type: string
          description: Stable machine-readable error identifier.
          enum:
          - templateElementNotCreated
          - templateElementNotFound
          - templateElementNotDeleted
          - templateElementNotUpdated
          - templateElementsNotListed
          - templateFieldNotCreated
          - templateFieldNotFound
          - templateFieldNotDeleted
          - templateFieldNotUpdated
          - templateFieldsNotListed
          - templateNotCreated
          - templateNotFound
          - templateNotDeleted
          - templateNotUpdated
          - templatesNotListed
          - templateInstanceNotCreated
          - templateInstanceNotFound
          - templateInstanceNotDeleted
          - templateInstanceNotUpdated
          - templateInstancesNotListed
          - noReadAccessToResource
          - noWriteAccessToResource
          - noReadAccessToFolder
          - noWriteAccessToFolder
          - noReadAccessToTemplate
          - noWriteAccessToTemplate
          - noReadAccessToTemplateElement
          - noWriteAccessToTemplateElement
          - noReadAccessToTemplateField
          - noWriteAccessToTemplateField
          - noReadAccessToTemplateInstance
          - noWriteAccessToTemplateInstance
          - noReadAccessToArtifact
          - noWriteAccessToArtifact
          - noReadAccessToCategory
          - noWriteAccessToCategory
          - folderNotFound
          - artifactNotFound
          - artifactPreconditionRequired
          - artifactHasMovedOn
          - verbatimWriteRefused
          - nodeNotFound
          - unknownResourceType
          - missingParameter
          - invalidInput
          - sourceFolderNotFound
          - sourceResourceNotFound
          - targetFolderNotFound
          - nodeNotMoved
          - groupNotFound
          - userNotFound
          - uniqueConstraintCollision
          - invalidData
          - notAuthorized
          - permissionMissing
          - tokenInvalid
          - userInfoLoadByTokenFailed
          - userInfoLoadByApiKeyFailed
          - cedarUserNotFound
          - authorizationNotFound
          - permissionNotOwned
          - authorizationTypeUnknown
          - apiKeyNotFound
          - tokenMissing
          - tokenExpired
          - parentFolderNotSpecified
          - parentFolderSpecifiedTwice
          - pathNotNormalized
          - parentFolderNotFound
          - updateInvalidFolderName
          - createInvalidFolderName
          - nodeAlreadyPresent
          - folderNotCreated
          - missingNameAndDescription
          - missingData
          - folderNotDeleted
          - artifactNotDeleted
          - resourceNotCreated
          - invalidResourceType
          - invalidArtifactType
          - readOtherProfileForbidden
          - updateOtherProfileForbidden
          - folderCanNotBeDeleted
          - folderCanNotBeChanged
          - groupAlreadyPresent
          - groupCanBeModifiedOnlyByGroupAdmin
          - groupCanBeDeletedOnlyByGroupAdmin
          - groupMembersCanBeReadOnlyByGroupAdmin
          - groupRequiresAdministrator
          - groupUsersNotUpdated
          - specialGroupCanNotBeDeleted
          - folderPermissionsCanNotBeChanged
          - unknownInstanceOutputFormat
          - folderCopyNotAllowed
          - methodNotImplemented
          - upstreamServerError
          - nothingToDo
          - parentCategoryNotFound
          - categoryAlreadyPresent
          - categoryNotFound
          - categoryCanNotBeDeleted
          - rootCategoryCanNotBeDeleted
          - unableToAttachCategory
          - unableToDetachCategory
          - noCategoriesWereAttached
          - malformedJsonRequestBody
          - malformedSearchTerm
          - publishedArtifactCanNotBeChanged
          - publishedArtifactCanNotBeDeleted
          - versioningOnlyOnLatest
          - versioningOnlyByOwner
          - nonVersionedArtifactType
          - createDraftOnlyFromPublished
          - publishOnlyDraft
          - draftNotCreated
          - contentNotValid
          - doiNotSupportedByResourceType
          - doiCanNotBeSetForEmptyAtId
          - doiCanNotBeAltered
          - doiCanNotBeSet
          - doiAlreadyExists
          - dataCiteDOIDisabled
          - pinnedVersionUnavailable
          - resourceNotFound
          - internalError
          nullable: true
        errorReasonKey:
          type: string
          description: More specific machine-readable reason for the error.
          enum:
          - nonEmptyFolder
          - nonEmptyCategory
          - userHomeFolder
          - systemFolder
          - templateReferencedInInstances
          - validationError
          - continuationExpired
          nullable: true
        errorType:
          type: string
          description: Broad category of the error.
          enum:
          - notFound
          - invalidArgument
          - authorization
          - permission
          - server
          - validationError
          nullable: true
        message:
          type: string
          description: Human-readable error message.
          nullable: true
        objects:
          type: object
          additionalProperties:
            type: object
            description: Named structured values associated with the error.
          description: Named structured values associated with the error.
        operation:
          type: object
          description: Operation that failed. Its fields depend on the operation type.
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: object
            description: Named scalar values associated with the error.
          description: Named scalar values associated with the error.
        status:
          type: string
          description: Symbolic HTTP response status.
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - NOT_ACCEPTABLE
          - CONFLICT
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - UNPROCESSABLE_ENTITY
          - PRECONDITION_REQUIRED
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - HTTP_VERSION_NOT_SUPPORTED
        statusCode:
          type: integer
          format: int32
          description: Numeric HTTP response status.
          maximum: 599
          minimum: 400
        suggestedAction:
          type: string
          description: Recovery action suggested to the client.
          enum:
          - none
          - requestRole
          - logout
          - logoutImmediately
          - provideAuthorizationHeader
          - refreshToken
          nullable: true
      required:
      - status
      - statusCode
    CedarGroupReference:
      type: object
      description: "A reference to a group. It appears wherever a group is named beside\
        \ something else, as the holder of a grant or as a group a user belongs to.\
        \ The name accompanies the identifier so a caller need not fetch the group\
        \ record to display it."
      properties:
        '@id':
          type: string
          format: uri
          description: Identifier of the group.
        schema:name:
          type: string
          description: Display name of the group.
      required:
      - '@id'
    CedarUserReference:
      type: object
      description: "A reference to a user. It appears wherever a user is named beside\
        \ something else, as the owner of a resource, the holder of a grant, or a\
        \ member of a group. The name and email accompany the identifier so a caller\
        \ need not fetch the user record to display them."
      properties:
        '@id':
          type: string
          format: uri
          description: Identifier of the user.
        email:
          type: string
          format: email
          description: Email address of the user.
        firstName:
          type: string
          description: Given name of the user.
        lastName:
          type: string
          description: Family name of the user.
      required:
      - '@id'
    ColumnInfo:
      type: object
      properties:
        aggregatable:
          type: boolean
        groupable:
          type: boolean
        key:
          type: string
        kind:
          type: string
        label:
          type: string
        note:
          type: string
    ColumnMeta:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        note:
          type: string
        type:
          type: string
          enum:
          - STRING
          - NUMBER
          - NANOS
          - TIMESTAMP
          - TEXT
    ComponentDeclarations:
      type: object
      additionalProperties: false
      description: One non-server component and the variables it declares.
      properties:
        component:
          type: string
        variables:
          type: array
          items:
            $ref: "#/components/schemas/DeclaredEnvironmentVariable"
    CoverageResult:
      type: object
      properties:
        notes:
          type: array
          items:
            type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableCoverage"
    CypherRow:
      type: object
      properties:
        component:
          type: string
        durationNanos:
          type: integer
          format: int64
        handler:
          type: string
        logTime:
          type: string
        operation:
          type: string
        parameters:
          type: string
        runnable:
          type: string
        runnableHash:
          type: string
    CypherStat:
      type: object
      properties:
        execCount:
          type: integer
          format: int64
        maxNanos:
          type: integer
          format: int64
        operation:
          type: string
        p50Nanos:
          type: integer
          format: int64
        p95Nanos:
          type: integer
          format: int64
        p99Nanos:
          type: integer
          format: int64
        runnableHash:
          type: string
        sample:
          type: string
    DeclaredEnvironmentVariable:
      type: object
      additionalProperties: false
      description: "One variable a component declares. A declaration is not a value,\
        \ and none is reported."
      properties:
        name:
          type: string
        presentInHostEnvironment:
          type: boolean
          description: "Whether this host sets the variable at all, which is the only\
            \ fact about a value that a component with nothing running can honestly\
            \ report."
        secure:
          type: boolean
          description: Whether the variable is flagged secret.
    EndpointStat:
      type: object
      properties:
        className:
          type: string
        component:
          type: string
        errorCount:
          type: integer
          format: int64
        httpMethod:
          type: string
        maxNanos:
          type: integer
          format: int64
        methodName:
          type: string
        p50Nanos:
          type: integer
          format: int64
        p95Nanos:
          type: integer
          format: int64
        p99Nanos:
          type: integer
          format: int64
        reqCount:
          type: integer
          format: int64
    EnvironmentDeclarationReport:
      type: object
      additionalProperties: false
      description: |
        The static declaration table for the components that are builds and scripts rather than
        running servers. Servers answer for themselves, with resolved values, on the server
        environment report.
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentDeclarations"
        note:
          type: string
          description: Why no value accompanies a declaration here.
    EnvironmentVariableEntry:
      type: object
      additionalProperties: false
      description: |
        Where one variable stands for one server. The state is what matters: a variable the server
        reads and the environment does not supply is a misconfiguration, while the same variable
        absent from a server that never reads it is by design.
      properties:
        name:
          type: string
        presentInHostEnvironment:
          type: boolean
          description: Whether the host's process environment sets the variable at
            all.
        secure:
          type: boolean
          description: "Whether the variable is flagged secret, and so whether its\
            \ value is masked."
        state:
          type: string
          enum:
          - SET
          - DECLARED_BUT_UNSET
          - USING_DEFAULT
          - NOT_DECLARED
        type:
          type: string
          enum:
          - STRING
          - NUMERIC
          - BOOLEAN
        value:
          type: string
          description: |
            The value, masked where the variable is secret. Null unless the state is SET: a value the
            server does not declare never leaves it, which is the point of the sandbox.
          nullable: true
    FacetResult:
      type: object
      properties:
        column:
          type: string
        elapsedMs:
          type: integer
          format: int64
        note:
          type: string
        table:
          type: string
        truncated:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
    FacetValue:
      type: object
      properties:
        count:
          type: integer
          format: int64
        value:
          type: string
    FilesystemUsage:
      type: object
      additionalProperties: false
      description: "The room left on one filesystem, read through a directory on it."
      properties:
        path:
          type: string
        totalBytes:
          type: integer
          format: int64
        usableBytes:
          type: integer
          format: int64
          description: What is left for this process.
        usedPercent:
          type: number
          format: double
          description: "How full the filesystem is, to one decimal place."
    Filter:
      type: object
      properties:
        col:
          type: string
        op:
          type: string
        val:
          type: string
        vals:
          type: array
          items:
            type: string
    FolderDiagnosticReport:
      type: object
      additionalProperties: false
      description: |
        What each store holds about one folder. Empty where the workspace graph does not know the
        identifier, since the graph's record is what the other sections are gathered from.
      properties:
        computed:
          type: object
          additionalProperties: false
          description: What the workspace derives from the graph rather than stores
            in it.
          properties:
            materializedPermissions:
              $ref: "#/components/schemas/MaterializedPermissions"
            permissions:
              $ref: "#/components/schemas/ResourcePermissions"
        neo4j:
          type: object
          additionalProperties: false
          properties:
            folder:
              allOf:
              - $ref: "#/components/schemas/WorkspaceResourceRecord"
              description: "The graph's record of the folder, with its path and parent\
                \ folder resolved."
        opensearch:
          type: object
          additionalProperties: false
          properties:
            document:
              $ref: "#/components/schemas/SearchIndexDocument"
        resourceType:
          type: string
          enum:
          - folder
    GroupDiagnosticReport:
      type: object
      additionalProperties: false
      description: |
        What each store holds about one group. Empty where the workspace graph does not know the
        identifier, since the graph's record is what the other sections are gathered from.
      properties:
        groupUsers:
          allOf:
          - $ref: "#/components/schemas/GroupMembership"
          description: The group's members and administrators.
        neo4j:
          allOf:
          - $ref: "#/components/schemas/WorkspaceResourceRecord"
          description: The graph's record of the group.
        opensearch:
          type: object
          additionalProperties: false
          description: |
            The keys the search index permits this group's resources under, one per role. Computed
            from the group identifier rather than read from the index, so they are what to look for
            in a document that is not being found.
          properties:
            editorKey:
              type: string
            managerKey:
              type: string
            viewerKey:
              type: string
        resourceType:
          type: string
          enum:
          - group
        searchCedarIds:
          type: array
          description: |
            Every indexed resource the group appears on. Null where OpenSearch could not be read:
            the failure is logged rather than returned.
          items:
            type: string
            format: uri
          nullable: true
    GroupMember:
      type: object
      additionalProperties: true
      description: "One user's place in a group. A member belongs to the group. An\
        \ administrator may change who belongs to it. The two are recorded independently,\
        \ so a user may administer a group without belonging to it."
      properties:
        administrator:
          type: boolean
          description: Whether the user may change who belongs to the group.
        member:
          type: boolean
          description: Whether the user belongs to the group.
        user:
          $ref: "#/components/schemas/CedarUserReference"
      required:
      - administrator
      - member
      - user
    GroupMembership:
      type: object
      additionalProperties: false
      description: "Everyone a group names, its members and its administrators together.\
        \ A membership is always given in full rather than a page at a time, and a\
        \ write replaces it rather than adding to it."
      properties:
        users:
          type: array
          description: One entry per user the group names.
          items:
            $ref: "#/components/schemas/GroupMember"
      required:
      - users
    Having:
      type: object
      properties:
        key:
          type: string
        op:
          type: string
        val:
          type: string
    HealthCheckError:
      type: object
      additionalProperties: false
      description: "What a health check threw, where it threw rather than reported."
      properties:
        cause:
          $ref: "#/components/schemas/HealthCheckError"
        message:
          type: string
          nullable: true
        stack:
          type: array
          items:
            type: string
        type:
          type: string
    HealthCheckReport:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/HealthCheckResult"
      description: |
        The named server's health checks, keyed by check name and serialized as that server
        serialized them. Which checks a server registers depends on the dependencies it holds.
    HealthCheckResult:
      type: object
      additionalProperties: true
      description: |
        One check's result. A check may attach details of its own, so the object is left open.
      properties:
        duration:
          type: integer
          format: int64
          description: "How long the check took, in milliseconds."
        error:
          $ref: "#/components/schemas/HealthCheckError"
        healthy:
          type: boolean
        message:
          type: string
          description: What the check reported. Absent where it reported nothing.
        timestamp:
          type: string
          description: When the check ran.
    HostDiskReport:
      type: object
      additionalProperties: false
      description: "Room left on the filesystems CEDAR writes to, and the largest\
        \ files under its log directory."
      properties:
        cedarHome:
          type: string
          nullable: true
        filesystems:
          type: array
          description: One entry per readable path. An unreadable path is skipped
            rather than reported as empty.
          items:
            $ref: "#/components/schemas/FilesystemUsage"
        logs:
          $ref: "#/components/schemas/LogDirectoryReport"
        scope:
          type: string
          description: Which host the report covers.
    HostGitReport:
      type: object
      additionalProperties: false
      description: The git state of every repository directly under CEDAR_HOME on
        this host.
      properties:
        cedarHome:
          type: string
          description: "CEDAR_HOME as this service resolved it, or null where its\
            \ sandbox does not carry it."
          nullable: true
        repositories:
          type: array
          description: "One entry per repository, sorted by name. Empty where CEDAR_HOME\
            \ could not be listed."
          items:
            $ref: "#/components/schemas/RepositoryState"
        scope:
          type: string
          description: Which host the report covers.
    Insights:
      type: object
      properties:
        errorHotspots:
          type: array
          items:
            $ref: "#/components/schemas/EndpointStat"
        heaviestUsers:
          type: array
          items:
            $ref: "#/components/schemas/UserStat"
        slowestCypher:
          type: array
          items:
            $ref: "#/components/schemas/CypherStat"
        slowestEndpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointStat"
    LogDirectoryReport:
      type: object
      additionalProperties: false
      description: "What the log directory holds, and the largest files in it."
      properties:
        directory:
          type: string
          nullable: true
        error:
          type: string
          description: "What the walk reported, where it failed."
        fileCount:
          type: integer
          format: int32
          description: "Every regular file under the directory, not only the ones\
            \ listed."
        files:
          type: array
          description: "The largest files, biggest first, capped at twenty-five entries."
          items:
            $ref: "#/components/schemas/LogFileEntry"
        readable:
          type: boolean
          description: False where the directory does not exist or could not be walked.
        totalBytes:
          type: integer
          format: int64
    LogFileEntry:
      type: object
      additionalProperties: false
      description: One log file's size and age. A large file written to seconds ago
        is a log nothing is rotating.
      properties:
        ageDays:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
        path:
          type: string
        sizeBytes:
          type: integer
          format: int64
    LogQuerySpec:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        from:
          type: string
        groupBy:
          type: array
          items:
            type: string
        grouped:
          type: boolean
        having:
          type: array
          items:
            $ref: "#/components/schemas/Having"
        limit:
          type: integer
          format: int32
        metrics:
          type: array
          items:
            type: string
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/Sort"
        source:
          type: string
        table:
          type: string
        to:
          type: string
    LogTableFreshness:
      type: object
      additionalProperties: false
      description: "The newest row in one log table, and how far behind it is."
      properties:
        lagSeconds:
          type: integer
          format: int64
          description: |
            Seconds between that row and the log database's own UTC clock, or null where the table is
            empty. A negative value is a clock disagreement rather than a lag, and is reported as it
            was measured.
          nullable: true
        newestAt:
          type: string
          description: "That row's timestamp in UTC, or null where the table is empty."
          nullable: true
        sqlTable:
          type: string
          description: The physical table name.
        table:
          type: string
          description: The table's key in the log query engine.
    LogUsageSummary:
      type: object
      additionalProperties: false
      description: |
        The totals for a range beside the hourly series behind them. The range is echoed back as the
        server resolved it, so a caller that omitted a bound can see which one it got.
      properties:
        from:
          type: string
          description: "The inclusive lower bound of the range, as a UTC instant."
        series:
          type: array
          description: "One entry per hour that holds a row, oldest first. Hours with\
            \ no traffic are absent."
          items:
            $ref: "#/components/schemas/TimeBucket"
        to:
          type: string
          description: "The exclusive upper bound of the range, as a UTC instant."
        totals:
          $ref: "#/components/schemas/UsageTotals"
    MaterializedPermissions:
      type: object
      additionalProperties: true
      description: |
        The grants after inheritance is resolved, which is the form the search index is permitted
        against. A role here can come from a folder above the resource rather than from a grant on
        the resource itself, so this and the recorded grants are expected to differ.
      properties:
        everybodyPermission:
          $ref: "#/components/schemas/NodeSharePermission"
        groupRoles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResourceRole"
          description: "The strongest role each group holds, keyed by group identifier."
        id:
          type: string
          format: uri
        userRoles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResourceRole"
          description: "The strongest role each user holds, keyed by user identifier."
    MySqlDatabase:
      type: object
      additionalProperties: false
      description: "One schema, with its tables and their totals."
      properties:
        dataBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
        indexBytes:
          type: integer
          format: int64
        name:
          type: string
        rowsApproximate:
          type: integer
          format: int64
        rowsExact:
          type: integer
          format: int64
          description: Null unless at least one table in the schema was counted exactly.
          nullable: true
        source:
          type: string
          description: Which datasource reached the schema first. Two datasources
            on one host can see the same schema.
        tableCount:
          type: integer
          format: int32
        tables:
          type: array
          description: "Every base table, largest first."
          items:
            $ref: "#/components/schemas/MySqlTable"
        totalBytes:
          type: integer
          format: int64
    MySqlReport:
      type: object
      additionalProperties: false
      description: |
        Every table in every MySQL schema CEDAR's configured datasources can see, with its row count
        and the space it occupies.
      properties:
        databases:
          type: array
          description: "One entry per schema reached, sorted by name."
          items:
            $ref: "#/components/schemas/MySqlDatabase"
        exactCounts:
          type: boolean
          description: Whether rows were counted rather than estimated.
        sources:
          type: array
          description: "One entry per configured datasource, whether or not it answered."
          items:
            $ref: "#/components/schemas/MySqlSource"
    MySqlSource:
      type: object
      additionalProperties: false
      description: |
        One configured datasource and what it reached. An unreachable database is reported here
        rather than thrown, because which parts of CEDAR are answering is the point of the report.
      properties:
        configKey:
          type: string
          description: The datasource's key in cedar-main.yml.
          enum:
          - dbLogging
          - messagingServer
        configured:
          type: boolean
        error:
          type: string
          description: "What the connection or the query reported, where one failed."
          nullable: true
        id:
          type: string
          enum:
          - log
          - messaging
        reachable:
          type: boolean
        schema:
          type: string
          description: The schema named in that URL.
          nullable: true
        schemas:
          type: array
          description: "The schemas this connection's user could see, in the order\
            \ they were read."
          items:
            type: string
        server:
          type: string
          description: The host and port the JDBC URL points at. Absent where the
            datasource is not configured.
    MySqlTable:
      type: object
      additionalProperties: false
      description: "One table, as information_schema describes it."
      properties:
        averageRowBytes:
          type: integer
          format: int64
          nullable: true
        countError:
          type: string
          description: "Why the exact count is missing, where it was asked for and\
            \ failed."
        createdAt:
          type: string
          format: date-time
          nullable: true
        dataBytes:
          type: integer
          format: int64
        engine:
          type: string
          nullable: true
        freeBytes:
          type: integer
          format: int64
          description: |
            Pages the table has released without returning them to the filesystem. A large value
            beside a small row count is a table that was emptied and never rebuilt.
        indexBytes:
          type: integer
          format: int64
        name:
          type: string
        rowsApproximate:
          type: integer
          format: int64
          description: |
            The optimizer's estimate, which for InnoDB comes from sampling and can be far out. Null
            where the optimizer holds no statistics for the table, which is not the same fact as an
            empty table.
          nullable: true
        rowsExact:
          type: integer
          format: int64
          description: "The counted rows. Null unless exact counting was asked for,\
            \ and null where that count failed."
          nullable: true
        totalBytes:
          type: integer
          format: int64
          description: Data and indexes together.
        updatedAt:
          type: string
          format: date-time
          nullable: true
    NodeSharePermission:
      type: string
      description: What everybody may do with the resource. Null where nothing is
        shared with everybody.
      enum:
      - read
      - write
      - null
      nullable: true
    QueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnMeta"
        elapsedMs:
          type: integer
          format: int64
        exact:
          type: boolean
        nextCursor:
          type: string
        notes:
          type: array
          items:
            type: string
        rowCount:
          type: integer
          format: int32
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        source:
          type: string
        truncated:
          type: boolean
    QueueDepths:
      type: object
      additionalProperties: false
      description: |
        How many items wait in each of CEDAR's Redis queues. A queue that keeps growing is the sign
        that whatever drains it has stopped.
      properties:
        appLog:
          type: integer
          format: int64
        cloneInstances:
          type: integer
          format: int64
        ncbiSubmission:
          type: integer
          format: int64
        searchPermission:
          type: integer
          format: int64
        valuerecommender:
          type: integer
          format: int64
    RepositoryState:
      type: object
      additionalProperties: false
      description: |
        One repository's git state. Every field but the name is null where the repository could not
        be read, and `error` then says why.
      properties:
        ahead:
          type: integer
          format: int32
          nullable: true
        behind:
          type: integer
          format: int32
          nullable: true
        branch:
          type: string
          description: "The checked-out branch, or `(detached)` where HEAD is not\
            \ on one."
          nullable: true
        commit:
          type: string
          description: The full commit SHA at HEAD.
          nullable: true
        committedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        repository:
          type: string
          description: The directory name under CEDAR_HOME.
        uncommittedFiles:
          type: integer
          format: int32
          description: How many tracked files differ from HEAD. Non-zero is a hot-patch
            applied on the box.
          nullable: true
        upstream:
          type: string
          nullable: true
    RequestRow:
      type: object
      properties:
        apiKeyHash:
          type: string
        authSource:
          type: string
        component:
          type: string
        durationNanos:
          type: integer
          format: int64
        errorPack:
          type: string
        globalRequestId:
          type: string
        handler:
          type: string
        httpMethod:
          type: string
        path:
          type: string
        requestTime:
          type: string
        status:
          type: integer
          format: int32
        userId:
          type: string
    ResourceGroupGrant:
      type: object
      description: One role granted to one group on a folder or artifact.
      properties:
        group:
          $ref: "#/components/schemas/CedarGroupReference"
        role:
          $ref: "#/components/schemas/ResourceRole"
      required:
      - group
      - role
    ResourceIdLookup:
      type: object
      additionalProperties: false
      description: |
        What the input resolved to, and how it was arrived at. A string that resolves to nothing is
        reported here with `success` false rather than as a failed request.
      properties:
        errorPhase:
          type: string
          description: |
            The last parsing step that failed. Present only on an unsuccessful lookup: a step that
            failed before a later one succeeded leaves no trace here.
          enum:
          - pathParsing
          - paramParsing
          - inputParsing
          - parameterParsing
        exceptionMessage:
          type: string
          description: "What the failing parse reported, where one threw."
        request:
          type: object
          additionalProperties: false
          description: "The input as received, and what could be parsed out of it."
          properties:
            input:
              type: string
              description: The query parameter exactly as it arrived.
              nullable: true
            path:
              type: string
              description: "The path, where the input parsed as a URL."
            queryParameters:
              type: array
              description: "The query string parsed into name and value pairs, where\
                \ the input parsed as a URI."
              items:
                type: object
                additionalProperties: true
                properties:
                  name:
                    type: string
                  value:
                    type: string
                    nullable: true
            queryString:
              type: string
              description: That URL's query string.
              nullable: true
            sanitizedInput:
              type: string
              description: The input with leading and trailing space removed. Empty
                where none arrived.
        resourceId:
          $ref: "#/components/schemas/ResourceIdReference"
        resourceIdSource:
          type: string
          description: Which part of the input the identifier was recognized in. Absent
            where nothing resolved.
          enum:
          - path
          - inputString
          - queryString
        resourceIdString:
          type: string
          description: "The identifier in full, or empty where nothing resolved."
        stackTrace:
          type: array
          description: Where that parse threw.
          items:
            $ref: "#/components/schemas/StackTraceFrame"
        success:
          type: boolean
          description: Whether the input resolved to an artifact identifier.
      required:
      - request
      - resourceIdString
      - success
    ResourceIdReference:
      type: object
      additionalProperties: false
      description: An artifact identifier taken apart into the pieces it is built
        from.
      nullable: true
      properties:
        protocol:
          type: string
        serverName:
          type: string
        type:
          type: string
          enum:
          - folder
          - field
          - element
          - template
          - element-instance
          - instance
          - user
          - group
          - category
          - message
          - user-message
          - process-type
        uuid:
          type: string
    ResourcePermissions:
      type: object
      description: "The owner of a folder or artifact, together with the user and\
        \ group grants recorded directly on it. A role that reaches the resource through\
        \ a folder above it is not listed here."
      properties:
        groupPermissions:
          type: array
          description: Every role granted directly to a group.
          items:
            $ref: "#/components/schemas/ResourceGroupGrant"
        owner:
          $ref: "#/components/schemas/CedarUserReference"
        userPermissions:
          type: array
          description: Every role granted directly to a user.
          items:
            $ref: "#/components/schemas/ResourceUserGrant"
      required:
      - groupPermissions
      - owner
      - userPermissions
    ResourceRole:
      type: string
      description: A role granted to a user or a group on an artifact or a folder.
        Each role includes everything the weaker roles allow.
      enum:
      - viewer
      - editor
      - manager
    ResourceUserGrant:
      type: object
      description: One role granted to one user on a folder or artifact.
      properties:
        role:
          $ref: "#/components/schemas/ResourceRole"
        user:
          $ref: "#/components/schemas/CedarUserReference"
      required:
      - role
      - user
    SearchIndexCounts:
      type: object
      additionalProperties: false
      description: |
        What the search index holds. Read alongside the workspace graph's counts: the two
        disagreeing is how a half-finished reindex shows itself.
      properties:
        opensearch:
          type: object
          additionalProperties: false
          properties:
            artifactTotal:
              type: integer
              format: int64
              description: "Every artifact document, whatever its type."
            element:
              type: integer
              format: int64
            field:
              type: integer
              format: int64
            folder:
              type: integer
              format: int64
            instance:
              type: integer
              format: int64
            recommenderTotal:
              type: integer
              format: int64
              description: Every document in the value recommender's own index.
            template:
              type: integer
              format: int64
    SearchIndexDocument:
      type: object
      additionalProperties: true
      description: |
        The OpenSearch document for the resource, as the index holds it. Null where the index has no
        document, and null as well where OpenSearch could not be read: the failure is logged rather
        than returned, so the two cases look alike here.
      nullable: true
    ServerBuildReport:
      type: object
      additionalProperties: false
      description: |
        The version the named server's environment declares, beside the artifact its JVM loaded. A
        server reporting the release version from an artifact older than the release was pulled and
        not rebuilt.
      properties:
        application:
          type: string
        artifactBuiltAt:
          type: string
          format: date-time
          nullable: true
        artifactError:
          type: string
          description: "Why the artifact could not be located, where it could not\
            \ be."
        artifactPath:
          type: string
          description: Where the server's own code was loaded from. Null where the
            class loader has no code source.
          nullable: true
        artifactSizeBytes:
          type: integer
          format: int64
          description: "Present for a jar, absent for a class directory."
        artifactType:
          type: string
          description: Whether that is a packaged jar or a build tree's class directory.
          enum:
          - jar
          - classes
        host:
          type: string
          nullable: true
        implementationVersion:
          type: string
          description: "Implementation-Version from the manifest, where the artifact\
            \ carries one."
          nullable: true
        java.vendor:
          type: string
        java.version:
          type: string
        jvm.name:
          type: string
        pid:
          type: integer
          format: int64
        server:
          type: string
        startedAt:
          type: string
          format: date-time
        uptimeMs:
          type: integer
          format: int64
        version:
          type: string
          nullable: true
        versionModifier:
          type: string
          nullable: true
    ServerConfigurationReport:
      type: object
      additionalProperties: false
      description: cedar-main.yml as the named server resolved it.
      properties:
        application:
          type: string
        configuration:
          type: object
          additionalProperties: true
          description: |
            The configuration template with this server's environment substituted into it, masked by
            key name and by value. A placeholder that could not be resolved is left as the literal
            ${NAME} rather than blanked, because that is the finding.
        server:
          type: string
    ServerEnvironmentReport:
      type: object
      additionalProperties: false
      description: The environment variables the named server resolved its configuration
        from.
      properties:
        application:
          type: string
          description: The server's display name.
        component:
          type: string
          description: The configuration model's name for the server.
          nullable: true
        server:
          type: string
          description: The server's name as the configuration spells it.
        variables:
          type: array
          description: "One entry per CEDAR variable, declared or not."
          items:
            $ref: "#/components/schemas/EnvironmentVariableEntry"
    ServerJvmReport:
      type: object
      additionalProperties:
        type: integer
        format: int64
        description: |
          One entry per garbage collector the JVM registered, named as that collector names itself
          and holding the collections it has run. Which collectors appear depends on the JVM.
      description: |
        What the named server's JVM is doing: memory, host, threads and garbage collection. Thread
        stack traces are not included; the server serves the full dump on its own route.
      properties:
        current-thread.cpu-time:
          type: integer
          format: int64
        current-thread.user-time:
          type: integer
          format: int64
        jvm.memory.heap.committed:
          type: integer
          format: int64
        jvm.memory.heap.init:
          type: integer
          format: int64
        jvm.memory.heap.max:
          type: integer
          format: int64
        jvm.memory.heap.used:
          type: integer
          format: int64
        jvm.memory.non-heap.committed:
          type: integer
          format: int64
        jvm.memory.non-heap.init:
          type: integer
          format: int64
        jvm.memory.non-heap.max:
          type: integer
          format: int64
        jvm.memory.non-heap.used:
          type: integer
          format: int64
        jvm.runtime.memory.free:
          type: integer
          format: int64
        jvm.runtime.memory.max:
          type: integer
          format: int64
        jvm.runtime.memory.total:
          type: integer
          format: int64
        os.architecture:
          type: string
        os.available-processors:
          type: integer
          format: int32
        os.load-average:
          type: number
          format: double
          description: "The host's one-minute load average, or a negative number where\
            \ the platform does not report it."
        os.name:
          type: string
        os.version:
          type: string
        thread.count:
          type: integer
          format: int32
        thread.daemon.count:
          type: integer
          format: int32
        thread.started.count:
          type: integer
          format: int64
    Sort:
      type: object
      properties:
        dir:
          type: string
        key:
          type: string
    StackTraceFrame:
      type: object
      additionalProperties: true
      description: "One frame of a Java stack trace, as the JVM reports it."
      properties:
        className:
          type: string
        fileName:
          type: string
          nullable: true
        lineNumber:
          type: integer
          format: int32
        methodName:
          type: string
        nativeMethod:
          type: boolean
    StoreCounts:
      type: object
      additionalProperties: false
      description: |
        What each store holds, counted store by store so the figures can be read against each other.
        The workspace graph is the authoritative count.
      properties:
        errorPack:
          type: string
          description: "What went wrong reading Keycloak, where it could not be read."
        keycloak:
          type: object
          additionalProperties: false
          description: The identity provider. Empty where Keycloak could not be read.
          properties:
            user:
              type: integer
              format: int32
        mongo:
          type: object
          additionalProperties: false
          description: "The artifact store, which holds no folders."
          properties:
            element:
              type: integer
              format: int64
            field:
              type: integer
              format: int64
            instance:
              type: integer
              format: int64
            template:
              type: integer
              format: int64
        neo4j:
          type: object
          additionalProperties: false
          description: The workspace graph.
          properties:
            category:
              type: integer
              format: int64
            element:
              type: integer
              format: int64
            field:
              type: integer
              format: int64
            folder:
              type: integer
              format: int64
            group:
              type: integer
              format: int64
            instance:
              type: integer
              format: int64
            template:
              type: integer
              format: int64
            user:
              type: integer
              format: int64
        opensearch:
          allOf:
          - $ref: "#/components/schemas/ArtifactCountsByType"
          description: The search index.
    TableCoverage:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnInfo"
        newest:
          type: string
        oldest:
          type: string
        rowCount:
          type: integer
          format: int64
        sqlTable:
          type: string
        table:
          type: string
    TimeBucket:
      type: object
      additionalProperties: false
      description: One hour of the request volume series.
      properties:
        errorCount:
          type: integer
          format: int64
        hourUtc:
          type: string
          description: "The hour this bucket covers, as a UTC instant on the hour."
        reqCount:
          type: integer
          format: int64
    TraceResult:
      type: object
      properties:
        componentCount:
          type: integer
          format: int32
        cypherCount:
          type: integer
          format: int32
        dbMs:
          type: number
          format: double
        dbSharePct:
          type: number
          format: double
        elapsedMs:
          type: integer
          format: int64
        globalRequestId:
          type: string
        handlerMs:
          type: number
          format: double
        notes:
          type: array
          items:
            type: string
        requestCount:
          type: integer
          format: int32
        spanMs:
          type: number
          format: double
        spans:
          type: array
          items:
            $ref: "#/components/schemas/TraceSpan"
        truncated:
          type: boolean
    TraceSpan:
      type: object
      properties:
        component:
          type: string
        detail:
          type: string
        durationMs:
          type: number
          format: double
        kind:
          type: string
        label:
          type: string
        localRequestId:
          type: string
        offsetMs:
          type: integer
          format: int64
        startedAt:
          type: string
        status:
          type: integer
          format: int32
    UnmodelledEnvironmentReport:
      type: object
      additionalProperties: false
      description: |
        CEDAR_* variables this host sets that the configuration model does not define. Names only:
        a variable outside the model carries no secrecy flag, so its value is withheld.
      properties:
        count:
          type: integer
          format: int32
        note:
          type: string
          description: "How to read the list, and why a name on it is not by itself\
            \ an unused variable."
        scope:
          type: string
          description: Which host the names were read from.
        variables:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              hasValue:
                type: boolean
                description: Whether the host sets the variable to something other
                  than the empty string.
          description: "One entry per unmodelled name, sorted by name."
    UsageTotals:
      type: object
      additionalProperties: false
      description: |
        Request volume and latency across a whole range. The percentiles are computed from the merged
        latency histogram of every covered hour, not averaged from per-hour percentiles. Every field
        is zero where no hour in the range holds a row.
      properties:
        errorCount:
          type: integer
          format: int64
        p50Nanos:
          type: integer
          format: int64
        p95Nanos:
          type: integer
          format: int64
        p99Nanos:
          type: integer
          format: int64
        reqCount:
          type: integer
          format: int64
    UserDiagnosticReport:
      type: object
      additionalProperties: false
      description: |
        What each store holds about one user. Empty where the user store does not know the
        identifier, since the stored profile is what the other sections are gathered from.
      properties:
        cedarUser:
          type: object
          additionalProperties: true
          description: |
            The stored user profile: identity, home folder, roles, permissions, API keys, UI
            preferences and the authentication source behind the account.
        keycloak:
          type: object
          additionalProperties: false
          properties:
            user:
              type: object
              additionalProperties: true
              description: |
                The Keycloak account behind the user, as Keycloak represents it, with its effective
                realm roles filled in. Null where Keycloak could not be read.
              nullable: true
        neo4j:
          type: object
          additionalProperties: false
          properties:
            extra:
              type: object
              additionalProperties: false
              description: What the graph answers about the user rather than stores
                about them.
              properties:
                accessibleCount:
                  allOf:
                  - $ref: "#/components/schemas/UserResourceCounts"
                  description: "How much of each type the user may reach, counted\
                    \ in the graph."
                groupsWithAdministrator:
                  type: array
                  items:
                    $ref: "#/components/schemas/CedarGroupReference"
                groupsWithMembership:
                  type: array
                  items:
                    $ref: "#/components/schemas/CedarGroupReference"
            user:
              allOf:
              - $ref: "#/components/schemas/WorkspaceResourceRecord"
              description: The graph's record of the user.
        opensearch:
          type: object
          additionalProperties: false
          description: |
            How much of each type the search index will return for the user at each role. A count of
            -1 means OpenSearch could not be read; the failure is logged rather than returned. Read
            against the graph's own count: the two disagreeing is how a stale permission index shows
            itself.
          properties:
            editorCount:
              $ref: "#/components/schemas/UserResourceCounts"
            managerCount:
              $ref: "#/components/schemas/UserResourceCounts"
            viewerCount:
              $ref: "#/components/schemas/UserResourceCounts"
        resourceType:
          type: string
          enum:
          - user
    UserResourceCounts:
      type: object
      additionalProperties: false
      description: One count per artifact type. Template instances are counted under
        `templateInstance`.
      properties:
        element:
          type: integer
          format: int64
        field:
          type: integer
          format: int64
        folder:
          type: integer
          format: int64
        template:
          type: integer
          format: int64
        templateInstance:
          type: integer
          format: int64
    UserStat:
      type: object
      properties:
        apiKeyHash:
          type: string
        authSource:
          type: string
        errorCount:
          type: integer
          format: int64
        reqCount:
          type: integer
          format: int64
        userId:
          type: string
    WorkerLagReport:
      type: object
      additionalProperties: false
      description: |
        The depth of the application log queue beside the age of the newest row the worker wrote.
        Reported together because neither number means anything alone.
      properties:
        appLogQueueDepth:
          type: integer
          format: int64
        laggingAfterSeconds:
          type: integer
          format: int64
          description: The lag above which the pipeline counts as behind.
        observedAt:
          type: string
          format: date-time
        stalledAfterSeconds:
          type: integer
          format: int64
          description: The lag above which nothing is taken to be draining.
        status:
          type: string
          description: The verdict the depth and the lag imply. UNKNOWN where nothing
            has been written at all.
          enum:
          - OK
          - LAGGING
          - STALLED
          - UNKNOWN
        tables:
          type: array
          items:
            $ref: "#/components/schemas/LogTableFreshness"
        worstLagSeconds:
          type: integer
          format: int64
          description: "The largest lag across the tables, or null where every table\
            \ is empty."
          nullable: true
    WorkspaceResourceRecord:
      type: object
      additionalProperties: true
      description: |
        One node as the workspace graph holds it. The identity, naming and provenance keys below are
        carried by every kind of node; a folder, an artifact, a group and a user each add their own,
        so the object is left open.
      properties:
        '@context':
          type: object
          additionalProperties:
            type: string
        '@id':
          type: string
          format: uri
        createdOnTS:
          type: integer
          format: int64
          nullable: true
        lastUpdatedOnTS:
          type: integer
          format: int64
          nullable: true
        oslc:modifiedBy:
          type: string
          format: uri
          nullable: true
        pav:createdBy:
          type: string
          format: uri
          nullable: true
        pav:createdOn:
          type: string
          format: date-time
          nullable: true
        pav:lastUpdatedOn:
          type: string
          format: date-time
          nullable: true
        resourceType:
          type: string
        schema:description:
          type: string
          nullable: true
        schema:identifier:
          type: string
          nullable: true
        schema:name:
          type: string
          nullable: true
        sourceHash:
          type: string
          nullable: true
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
