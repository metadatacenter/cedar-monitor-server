openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The monitor server reports on the rest of CEDAR: how deep the work queues are, how much each
    store holds, whether a given server considers itself healthy, and what artifact a given string
    refers to.

    Everything here is read-only and needs the monitor read permission. The counts are meant to be
    read against each other: the workspace graph is authoritative, and the search index disagreeing
    with it is how a half-finished reindex shows itself.
  title: CEDAR Monitor Server API
  version: 2.9.12
paths:
  /:
    get:
      operationId: showInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The service name and links to its API documentation
      summary: Describe this CEDAR service
      tags:
      - Service
  /command/resource-id-lookup:
    get:
      description: "Take anything that might name a CEDAR artifact — an identifier,\
        \ an IRI, a URL from the workbench, a path with a query string — and report\
        \ the artifact identifier it resolves to, and how that was arrived at. Written\
        \ for reading a support ticket or a log line, where what arrives is whatever\
        \ a user pasted. Always answers 200: a string that resolves to nothing is\
        \ a finding, not a failed request, and the body says so."
      operationId: lookUpResource
      parameters:
      - description: The string to resolve. Leading and trailing space is trimmed;
          the sanitized form is echoed in the response.
        in: query
        name: input
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceIdLookup"
          description: "What the input resolved to, and how"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Work out which artifact a string refers to
      tags:
      - Diagnostics
  /environment-model/declarations:
    get:
      description: "The static declaration table for the frontends, the admin and\
        \ caDSR tools, the Keycloak event listener and the shell utilities. Names\
        \ only — these components are builds and scripts, not processes that can be\
        \ asked what they resolved."
      operationId: declarations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDeclarationReport"
          description: Declared variable names per component
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get the declared variables of every non-server component
      tags:
      - Environment model
  /environment-model/unmodelled:
    get:
      description: "Names only, never values: a variable outside CedarEnvironmentVariable\
        \ carries no secrecy flag, so its value is withheld. A name here is either\
        \ a consumer reading the environment directly, or a variable that has fallen\
        \ out of use."
      operationId: unmodelled
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmodelledEnvironmentReport"
          description: Names of unmodelled CEDAR_* variables
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get CEDAR_* variables set on this host that the configuration model
        does not define
      tags:
      - Environment model
  /health-check/{server}:
    get:
      description: "Proxy the named server's health check. The status and body are\
        \ the other server's own, so a 500 here can mean that server is unhealthy\
        \ rather than that this one failed."
      operationId: healthCheck
      parameters:
      - description: "CEDAR server name, as the configuration spells it. Examples:\
          \ artifact, terminology, resource."
        in: path
        name: server
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckReport"
          description: "The named server's health check, as it reported it"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No CEDAR server answers to this name
        "500":
          description: "The named server reported itself unhealthy with its own body,\
            \ or its response could not be read"
      security:
      - api_key: []
      summary: Get another server's health check
      tags:
      - Health checks
  /healthcheck:
    get:
      operationId: healthCheck_1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Every health check passed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: object
          description: At least one health check failed
      security:
      - api_key: []
      summary: Run this service's health checks
      tags:
      - Service diagnostics
  /host/disk:
    get:
      description: "Room left on the filesystems CEDAR writes to, plus the largest\
        \ files under CEDAR_HOME/log with their sizes and ages. A large file that\
        \ is still being written to is a log nothing is rotating."
      operationId: disk
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDiskReport"
          description: Filesystem usage and log file sizes
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get disk usage and the largest log files on this host
      tags:
      - Host
  /host/git:
    get:
      description: "Branch, commit, commit date, upstream distance and uncommitted\
        \ tracked-file count for each repository under CEDAR_HOME. A non-zero uncommitted\
        \ count is a hot-patch applied directly on the box, which the next pull would\
        \ overwrite."
      operationId: git
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostGitReport"
          description: One entry per repository
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: Get the git state of every CEDAR repository on this host
      tags:
      - Host
  /insight/full:
    get:
      operationId: full
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report all JVM diagnostics except per-thread stack traces
      tags:
      - Service diagnostics
  /insight/gc:
    get:
      operationId: gc
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM garbage-collection counts
      tags:
      - Service diagnostics
  /insight/memory:
    get:
      operationId: memory
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM memory use
      tags:
      - Service diagnostics
  /insight/system:
    get:
      operationId: system
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report operating-system information
      tags:
      - Service diagnostics
  /insight/thread-details:
    get:
      operationId: threadDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report details and stack traces for every JVM thread
      tags:
      - Service diagnostics
  /insight/threads:
    get:
      operationId: threads
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM thread counts
      tags:
      - Service diagnostics
  /logs/boards:
    get:
      description: "The catalogue of predefined questions, each one a saved query\
        \ spec a client can load into the same controls and edit. The catalogue is\
        \ served from here so a client's list cannot drift from what the query engine\
        \ supports. Specs carry no time range: the caller supplies one, and `defaultRangeMinutes`\
        \ is only a suggested starting window. A few boards join the two log tables\
        \ and so cannot be a spec; those name a route in `endpoint`, which the caller\
        \ reads instead of posting `spec`. Requires the monitor read permission."
      operationId: boards
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
          description: The board catalogue
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
      security:
      - api_key: []
      summary: List the predefined Insight boards
      tags:
      - Log query
  /logs/coverage:
    get:
      description: "Per log table: the columns a query may name, which of them can\
        \ be grouped and which aggregated, and the rows and time window the table\
        \ actually holds. Some columns were added after logging began and so carry\
        \ values only for recent rows; the notes on a column say so. A client reads\
        \ this to state its own caveats rather than showing a column that looks broken.\
        \ Requires the monitor read permission."
      operationId: coverage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageResult"
          description: The queryable surface and the data behind it
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: Describe what is queryable and what is actually present
      tags:
      - Log query
  /logs/db-share:
    get:
      description: "One row per handler and component over the range, slowest in total\
        \ first, with the request count, the summed handler time, the summed Cypher\
        \ time and the share the second is of the first. The answer comes back in\
        \ the same shape as a structured query, so a client renders it with the same\
        \ table. It needs a route of its own only because it joins the request log\
        \ to the Cypher log, which a spec cannot express. Requires the monitor read\
        \ permission."
      operationId: dbShare
      parameters:
      - description: "Inclusive lower bound, as an ISO-8601 instant in UTC. Defaults\
          \ to seven days before the upper bound."
        in: query
        name: from
        schema:
          type: string
      - description: "Exclusive upper bound, as an ISO-8601 instant in UTC. Defaults\
          \ to now."
        in: query
        name: to
        schema:
          type: string
      - description: How many rows to return. Defaults to 100 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: "One row per handler, slowest in total first"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "A bound was not an ISO-8601 instant, or `from` was not before\
            \ `to`"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: Compare each handler's total time against the database time underneath
        it
      tags:
      - Log query
  /logs/explorer/cypher:
    get:
      description: "One row per Neo4j statement the raw Cypher log still holds, which\
        \ covers roughly the last thirty days. This route reports statements CEDAR\
        \ already ran, with their text, their bound parameters and how long each took.\
        \ It does not accept or run a query of its own. Requires the monitor read\
        \ permission."
      operationId: cypher
      parameters:
      - description: "Free-text filter, matched as a substring against the operation\
          \ name, the statement hash, the handler class and the statement text. Omit\
          \ to match every row."
        in: query
        name: q
        schema:
          type: string
      - description: Keep only statements that took at least this many milliseconds.
          Zero and negative values are treated as no filter.
        in: query
        name: minDurationMs
        schema:
          type: integer
          format: int64
      - description: How many rows to return. Defaults to 100 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CypherRow"
          description: "Matching Cypher rows, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: "List recently executed Cypher statements, newest first"
      tags:
      - Log explorer
  /logs/explorer/outliers/cypher:
    get:
      description: "The Cypher instances the aggregator keeps past the prune, each\
        \ with its full statement text and bound parameters. This route reports statements\
        \ CEDAR already ran; it does not accept or run a query of its own. Requires\
        \ the monitor read permission."
      operationId: cypherOutliers
      parameters:
      - description: How many rows to return. Defaults to 100 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CypherRow"
          description: "Retained outlier Cypher rows, slowest first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: "List the retained slowest Cypher statements, slowest first"
      tags:
      - Log explorer
  /logs/explorer/outliers/requests:
    get:
      description: "The request instances the aggregator keeps past the prune, so\
        \ a slow call from months ago is still readable. The rows carry no global\
        \ request identifier, because the raw row they were copied from is gone. Requires\
        \ the monitor read permission."
      operationId: requestOutliers
      parameters:
      - description: "Which kind of outlier to return, `SLOW` or `ERROR`. Matched\
          \ case-insensitively. Omit to return both."
        in: query
        name: kind
        schema:
          type: string
          enum:
          - SLOW
          - ERROR
      - description: How many rows to return. Defaults to 100 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestRow"
          description: "Retained outlier request rows, slowest first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: "List the retained slowest and failed requests, slowest first"
      tags:
      - Log explorer
  /logs/explorer/requests:
    get:
      description: "One row per request the raw request log still holds, which covers\
        \ roughly the last thirty days. Each row carries the caller, the handler that\
        \ served it, the status and the handler duration in nanoseconds. Requires\
        \ the monitor read permission."
      operationId: requests
      parameters:
      - description: "Free-text filter, matched as a substring against the path, the\
          \ user identifier, the handler class and the global request identifier.\
          \ Omit to match every row."
        in: query
        name: q
        schema:
          type: string
      - description: Keep only requests whose handler took at least this many milliseconds.
          Zero and negative values are treated as no filter.
        in: query
        name: minDurationMs
        schema:
          type: integer
          format: int64
      - description: How many rows to return. Defaults to 100 and is capped at 500.
        in: query
        name: limit
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestRow"
          description: "Matching request rows, newest first"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: "List recent HTTP requests, newest first"
      tags:
      - Log explorer
  /logs/facets/{column}:
    get:
      description: "What a filter dropdown needs: every value the column took over\
        \ the range, most frequent first, with how often each occurred. Only columns\
        \ the engine marks facetable can be asked for. The result says whether the\
        \ value list was capped. Requires the monitor read permission."
      operationId: facet
      parameters:
      - description: "The column to enumerate, named as the coverage route names it."
        in: path
        name: column
        required: true
        schema:
          type: string
      - description: Which log table to read. Defaults to the request log.
        in: query
        name: table
        schema:
          type: string
      - description: "Inclusive lower bound, as an ISO-8601 instant in UTC. Defaults\
          \ to 24 hours before the upper bound."
        in: query
        name: from
        schema:
          type: string
      - description: "Exclusive upper bound, as an ISO-8601 instant in UTC. Defaults\
          \ to now."
        in: query
        name: to
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetResult"
          description: The column's distinct values and their counts
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "The table or column is not known or not facetable, a bound\
            \ was not an ISO-8601 instant, or `from` was not before `to`"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The caller lacks the monitor read permission
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: The log database could not be read
      security:
      - api_key: []
      summary: "List the distinct values of one column, with their counts"
      tags:
      - Log query
  /logs/query:
    post:
      description: "The one query surface the Explorer, the pivot view and every Insight\
        \ board are built on. The body is a structured spec rather than SQL text:\
        \ column names are resolved against an allowlist and values are bound, so\
        \ a spec naming a column the engine does not know is rejected rather than\
        \ run. An empty `groupBy` returns raw rows newest first, paged by the cursor\
        \ the previous result handed back; a non-empty one returns an aggregate. The\
        \ result carries its own provenance, so a caller can tell an exact answer\
        \ from a histogram-approximate one and a complete result from a capped one.\
        \ It is POST rather than GET because a spec with several filters and a metric\
        \ list outgrows a URL. Requires the monitor read permission."
      operationId: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogQuerySpec"
        description: "The query to run. Every field is optional and is normalized\
          \ before use: `table` defaults to the request log, `source` selects the\
          \ raw log tables or the hourly rollups, and `limit` is capped by the engine."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: "The columns, the rows and the result's provenance"
        "400":
          content:
