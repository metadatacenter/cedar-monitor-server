      summary: Count what the workspace graph holds
      tags:
      - Counts
  /resources/counts/opensearch:
    get:
      description: "Report how many artifacts of each type OpenSearch has indexed.\
        \ Read alongside the graph counts: the two disagreeing is how a half-finished\
        \ reindex shows itself."
      operationId: openSearchCounts
      responses:
        "200":
          description: "A count per artifact type, as the search index has them"
        "401":
